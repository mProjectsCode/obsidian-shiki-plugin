name: Create plugin release
on:
    push:
        tags: ['*']
permissions:
    contents: read
jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '25.8.0'
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: '1.4.0'
            - run: bun install --frozen-lockfile
            - name: Extract tagged changelog entry
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
                  RELEASE_NOTES_PATH: ${{ runner.temp }}/plugin-release-notes.md
              run: bun x --no-install lemons-automation release:notes
            - name: Validate tagged version and prepare release manifest
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: bun x --no-install lemons-automation release:manifest
            - name: Capture review findings for this release
              continue-on-error: true
              run: bun run lint:review --format json --output-file review.json
            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              if: ${{ !cancelled() && hashFiles('review.json') != '' }}
              with:
                  name: release-review-findings
                  path: review.json
                  if-no-files-found: error
            - run: bun run verify
            - run: bun x --no-install lemons-automation package
            - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
              with:
                  subject-path: |
                      dist/*
                      artifacts/*.zip
            - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
              with:
                  prerelease: ${{ contains(github.ref_name, 'canary') }}
                  fail_on_unmatched_files: true
                  body_path: ${{ runner.temp }}/plugin-release-notes.md
                  files: |
                      dist/*
                      artifacts/*.zip
